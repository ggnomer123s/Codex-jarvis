[project]
name = "tigo-desktop-ui"
version = "0.14.4"
description = "A native Tigo desktop console for Codex CLI"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
speech = ["sounddevice>=0.5,<1", "numpy>=1.26,<3", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "filelock>=3.16,<4", "edge-tts==7.3.1", "av>=14,<20"]
voice = [
    "faster-whisper>=1.1,<2",
    "sounddevice>=0.5,<1",
    "numpy>=1.26,<3",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "filelock>=3.16,<4",
    "edge-tts==7.3.1",
    "av>=14,<20",
    "speechrecognition>=3.14,<4",
    "webrtcvad-wheels>=2.0.14,<3",
]

[project.scripts]
tigo-gui = "tigo_gui.app:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tigo_gui"]
