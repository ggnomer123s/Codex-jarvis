[project]
name = "jarvis-desktop-ui"
version = "0.5.0"
description = "A native JARVIS desktop console for Codex CLI"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2", "sounddevice>=0.5,<1", "numpy>=1.26,<3"]

[project.scripts]
jarvis-gui = "jarvis_gui.app:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_gui"]
