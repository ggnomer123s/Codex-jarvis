name: Static checks
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($_.Name): $($errors | Out-String)" }
          }
      - name: Check Python syntax
        run: python3 -m py_compile scripts/x11_mcp.py scripts/jarvis_memory.py scripts/jarvis_voice.py scripts/sync_agents.py tests/test_memory.py tests/test_gui_regressions.py tests/test_full_launcher.py
      - name: Verify local memory lifecycle
        run: python3 -m unittest discover -s tests -v
      - name: Check English documentation and managed scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path("README.md"), *Path("docs").glob("*.md"), *Path("config").glob("*.md"),
                   *Path("skills").rglob("*.md"), *Path("scripts").glob("*.sh"),
                   *Path("scripts").glob("*.ps1"), *Path("scripts").glob("*.py")]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              assert not any("\u0400" <= c <= "\u052f" for c in text), f"Unexpected Cyrillic text: {path}"
          print("Documentation and scripts: English only")
          PY

  desktop-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install locked desktop dependencies
        run: uv sync --project gui --frozen
      - name: Test process bridge and actual QML window
        run: uv run --project gui --frozen python scripts/check_desktop_ui.py
      - name: Test protocol and simulated audio
        run: python -m unittest discover -s tests -p "test_desktop_*.py" -v
      - name: Load desktop window
        run: uv run --project gui --frozen jarvis-gui --smoke-test
